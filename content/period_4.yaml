period: 4
days: "15-30"
title: "Психологическая фаза"
subtitle: "Мозг заново учится регулировать себя"

physiology:
  heading: "Что происходит"
  body: >
    Физическая отмена завершена у большинства людей.
    Теперь идёт психологическая реадаптация — префронтальная кора
    восстанавливает регуляторный контроль над лимбической системой
    без химической поддержки извне.
    Эндогенная система вознаграждения перестраивается:
    мозг заново калибрует что считать стимулом достаточным
    для выброса дофамина.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Волны плохого настроения без видимой причины"
      cause: "Лимбическая система ещё не под стабильным контролем префронтальной коры — эмоциональный фон колеблется"
    - symptom: "Возможна субдепрессивная симптоматика"
      cause: "Система вознаграждения в процессе перекалибровки — базовый гедонический тонус временно снижен"
    - symptom: "Сильная тяга при определённых ситуациях, запахах, людях"
      cause: "Условный рефлекс: дофаминовый ответ на триггер закреплён годами употребления. Это не слабость воли — это нейронная дорожка"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Префронтальная кора наращивает регуляторные связи с лимбической системой.
    Именно этот процесс формирует способность фокусироваться, откладывать
    импульсы и работать без внешней химической поддержки.
    Это самый важный период с точки зрения долгосрочного восстановления.

tip:
  heading: "Совет на этот период"
  body: >
    Триггеры — главная угроза срыва сейчас, не настроение и не тяга сама по себе.
    Не проверяй себя на прочность намеренно оказываясь в триггерных ситуациях —
    это не тренировка силы воли, это активация нейронной дорожки которую
    ты сейчас пытаешься ослабить.

