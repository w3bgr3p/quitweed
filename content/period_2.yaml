period: 2
days: "4-7"
title: "Пик дискомфорта"
subtitle: "Дофаминовая система в дефиците"

physiology:
  heading: "Что происходит"
  body: >
    CB1-рецепторы продолжают апрегуляцию — но дофаминовая система
    сейчас в худшей точке. THC годами искусственно стимулировал
    дофаминергические пути вентральной области покрышки.
    Без этой стимуляции базовый уровень дофамина субъективно
    ощущается как серость и пустота — хотя физиологически он в норме.
    Серотониновая регуляция также нарушена. Это физиологически
    самая тяжёлая неделя — не потому что становится хуже,
    а потому что острая фаза ещё не прошла а дофаминовый дефицит достиг пика.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Всё кажется пресным и неинтересным (ангедония)"
      cause: "Дофаминовые рецепторы не получают привычной стимуляции — система вознаграждения работает вполсилы"
    - symptom: "Подавленное настроение, дисфория"
      cause: "Серотониновая регуляция нарушена. Мозг ещё не восстановил эндогенный баланс"
    - symptom: "Плохой сон — много сновидений, поверхностный, частые пробуждения"
      cause: "REM rebound: THC подавлял REM-фазу годами. Теперь мозг компенсирует — избыток REM, тревожные сны"
    - symptom: "Раздражительность на пике"
      cause: "Лимбическая система перевозбуждена, префронтальный контроль ослаблен — реакции сильнее чем обычно"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Нормализуется аппетит и работа ЖКТ — CB1-рецепторы гипоталамуса
    начинают реагировать на эндогенные сигналы голода правильно.
    Серотониновая система начинает восстановительный процесс —
    субъективно это пока не ощущается, но биохимически уже происходит.

tip:
  heading: "Совет на этот период"
  body: >
    Не принимай важных решений на этой неделе — эмоциональный фон
    физиологически искажён и не отражает реальность.
    Магний глицинат 300-400 мг вечером снижает возбудимость нервной системы
    и улучшает качество сна без побочных эффектов.

timeline_marker:
  position: 2
  intensity: 10
  label: "Дофаминовый минимум"
  color: "#c0392b"
