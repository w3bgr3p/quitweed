period: 5
days: "31-60"
title: "Когнитивное восстановление"
subtitle: "Исполнительные функции возвращаются"

physiology:
  heading: "Что происходит"
  body: >
    CB1-рецепторы восстановлены на 80-90%.
    Дофаминовая система нормализована — рецепторы вернули чувствительность
    к эндогенным стимулам. Начинается восстановление исполнительных функций:
    рабочей памяти, планирования, торможения импульсов.
    Это функции префронтальной коры которые THC подавлял хронически
    при ежедневном употреблении.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Эмоциональные качели сглаживаются"
      cause: "Префронтальный контроль над лимбической системой стабилизировался"
    - symptom: "Неожиданные окна ясности — непривычно чёткое мышление"
      cause: "Рабочая память и исполнительные функции восстанавливаются — мозг работает без хронического CB1-подавления"
    - symptom: "Тяга в стрессовых ситуациях"
      cause: "Механизм stress-induced reinstatement: кортизол активирует дофаминергические пути связанные с употреблением. Стресс — главный триггер срыва в этот период"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Исполнительные функции: планирование, торможение импульсов,
    переключение внимания, рабочая память.
    Скорость обработки информации нарастает.
    Нейрогенез гиппокампа продолжается — долгосрочная память улучшается.

tip:
  heading: "Совет на этот период"
  body: >
    Давай мозгу сложные задачи — это ускоряет нейропластическую адаптацию.
    Когнитивная нагрузка в этот период работает как тренировка
    восстанавливающихся исполнительных функций.
    Управляй стрессом активно — он сейчас биохимически опасен для срыва.

