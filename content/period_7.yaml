period: 7
days: "90+"
title: "Долгосрочная адаптация"
subtitle: "Трезвое состояние стало базовым"

physiology:
  heading: "Что происходит"
  body: >
    Эндоканнабиноидная система восстановлена.
    Мозг адаптирован к трезвому состоянию как к базовому — не как
    к "состоянию без вещества", а как к норме.
    При стаже 15+ лет некоторые когнитивные паттерны могут сохраняться.
    Это не остаточные эффекты каннабиса — это особенности
    которые существовали до употребления или были им замаскированы.

symptoms:
  heading: "Что может сохраняться и почему"
  items:
    - symptom: "Трудности с фокусом в определённых условиях"
      cause: "Возможный pre-existing паттерн (например СДВГ) который каннабис частично компенсировал. Не отмена — это отдельный вопрос"
    - symptom: "Ситуативная тяга при сильных триггерах"
      cause: "Условные нейронные дорожки не исчезают полностью — они ослабевают. При отсутствии подкрепления угасают годами"
    - symptom: "Изменённое восприятие удовольствия от привычных вещей"
      cause: "Система вознаграждения перекалибрована под естественные стимулы — это адаптация, не потеря"

recovering:
  heading: "Что завершилось"
  body: >
    Полная нейропластическая адаптация.
    CB1-рецепторы восстановлены. Нейрогенез гиппокампа завершён.
    Исполнительные функции на максимуме доступном конкретному мозгу.
    Дальнейшие изменения — это уже не восстановление после отмены,
    а обычная жизнь мозга.

tip:
  heading: "Что стоит сделать на этом этапе"
  body: >
    Если трудности с фокусом, импульсивностью или регуляцией настроения
    сохраняются на этом сроке — это повод разобраться с этим отдельно,
    не в контексте отмены. Каннабис мог 10-15 лет маскировать что-то
    что существовало до него.

timeline_marker:
  position: 7
  intensity: 1
  label: "Долгосрочная адаптация"
  color: "#1abc9c"
