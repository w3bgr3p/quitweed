period: 6
days: "61-90"
title: "Нормализация"
subtitle: "Система вознаграждения работает автономно"

physiology:
  heading: "Что происходит"
  body: >
    CB1-рецепторы восстановлены полностью или близко к тому.
    При стаже употребления 10+ лет полное восстановление
    может занять до 6 месяцев — индивидуально.
    Нейрогенез гиппокампа в завершающей активной фазе.
    Эндогенная система вознаграждения функционирует без внешней поддержки.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Большинство симптомов отмены исчезли"
      cause: "Нейрохимический баланс восстановлен — физиологических причин для дискомфорта больше нет"
    - symptom: "Базовое настроение и энергия стабилизировались"
      cause: "Серотониновая и дофаминовая регуляция работают автономно"
    - symptom: "Тяга ситуативная, не фоновая"
      cause: "Условные нейронные дорожки ослабли но не исчезли полностью — активируются только сильными триггерами"
    - symptom: "Сон нормализован"
      cause: "REM-регуляция восстановлена полностью"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Нейрогенез гиппокампа завершает активную фазу.
    Долгосрочная и рабочая память на уровне или выше доупотребительного —
    субъективно это ощущается как улучшение способности удерживать контекст,
    запоминать детали, воспроизводить информацию.

tip:
  heading: "Совет на этот период"
  body: >
    Выяви ситуации в которых каннабис выполнял конкретную функцию —
    фокус, сон, тревога, социальный дискомфорт — и найди
    конкретную замену под каждую. Не общую, а точечную.
    Это снижает вероятность срыва при встрече с этими ситуациями.

