period: 3
days: "8-14"
title: "Стабилизация физиологии"
subtitle: "Острая фаза позади"

physiology:
  heading: "Что происходит"
  body: >
    CB1-рецепторы восстановились примерно на 50-70% от нормы.
    Норадреналиновая активность нормализуется — симпатическая нервная система
    перестаёт работать в режиме постоянного возбуждения.
    Дофаминовая система начинает стабилизироваться.
    Физически тело адаптировалось к отсутствию THC —
    теперь основная работа переходит с физиологии на нейропластику.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Физическое беспокойство снижается"
      cause: "Норадреналиновый выброс нормализован — симпатическая система больше не перегружена"
    - symptom: "Сон улучшается но нестабилен"
      cause: "REM rebound ещё не завершён — сновидения интенсивные, но засыпание уже легче"
    - symptom: "Когнитивный туман (brain fog)"
      cause: "Префронтальная кора восстанавливает связи — процесс идёт, но ещё не завершён"
    - symptom: "Появляются хорошие часы"
      cause: "Дофаминовая система начала реагировать на естественные стимулы — первые окна нормального самочувствия"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Гиппокамп запустил нейрогенез — образование новых нейронных связей.
    THC хронически подавлял этот процесс через CB1-рецепторы гиппокампа.
    Именно гиппокамп отвечает за краткосрочную память и пространственную навигацию —
    улучшение будет заметно в ближайшие недели.

tip:
  heading: "Совет на этот период"
  body: >
    Начни восстанавливать рабочие ритуалы — фиксированное время работы,
    одно рабочее место, телефон вне досягаемости во время рабочего блока.
    Мозгу нужны внешние структуры пока внутренняя регуляция ещё восстанавливается.

