period: 1
days: "1-3"
title: "Острая фаза"
subtitle: "Организм обнаружил отсутствие вещества"

physiology:
  heading: "Что происходит"
  body: >
    CB1-рецепторы эндоканнабиноидной системы годами работали в условиях
    постоянного избытка агониста — THC. В ответ мозг снизил их количество
    и чувствительность (downregulation). Теперь THC нет, а собственных
    эндоканнабиноидов не хватает чтобы заполнить этот дефицит.
    Одновременно норадреналиновая активность — которую THC подавлял —
    резко возросла. Симпатическая нервная система работает в режиме
    избыточного возбуждения без внешнего тормоза.

symptoms:
  heading: "Почему ты чувствуешь то что чувствуешь"
  items:
    - symptom: "Невозможность сидеть на месте, физическое беспокойство"
      cause: "Избыток норадреналина — нет THC чтобы подавить симпатическую активность"
    - symptom: "Мысли прыгают, невозможно сосредоточиться"
      cause: "Дофаминовая регуляция нарушена — мозг ищет быстрые замены (телефон, еда, любой стимул)"
    - symptom: "Раздражительность"
      cause: "Лимбическая система без внешней регуляции реагирует на всё сильнее обычного"
    - symptom: "Не можешь заснуть"
      cause: "THC подавлял REM-фазу и ускорял засыпание. Без него мозг не умеет отключаться так же быстро"
    - symptom: "Аппетит нарушен"
      cause: "CB1-рецепторы в гипоталамусе регулировали голод через THC — теперь сигналы сбиты"

recovering:
  heading: "Что восстанавливается прямо сейчас"
  body: >
    Начинается апрегуляция CB1-рецепторов — мозг постепенно увеличивает
    их количество и чувствительность в ответ на отсутствие THC.
    Этот процесс уже идёт с первого дня, даже если субъективно
    ничего хорошего не ощущается.

tip:
  heading: "Совет на этот период"
  body: >
    Физическая нагрузка утром — бег, плавание, что угодно интенсивное.
    Эндогенные каннабиноиды (анандамид) выделяются при аэробной нагрузке
    и частично заполняют тот же дефицит который создаёт отмена.
    Мелатонин 3-5 мг за 30 минут до сна — не снотворное,
    сигнал мозгу что пора отключаться.

