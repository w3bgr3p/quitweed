period: 1
days: "1-3"
title: "Острая фаза"
facts:
  - day: 1
    scientific: "CB1-рецепторы после хронической стимуляции THC находятся в состоянии downregulation — их плотность на мембране снижена на 20-60%. Процесс апрегуляции занимает 2-4 недели."
    plain: "Рецепторы в мозге, которые реагировали на THC, сейчас частично отключены — их стало меньше. Это защитная реакция на постоянную перегрузку. Сейчас они начинают возвращаться, но процесс медленный. Поэтому первые дни ощущаются особенно остро — система работает вполсилы."
  - day: 2
    scientific: "Норадреналин в префронтальной коре и миндалине не подавляется эндоканнабиноидами. Симпатическая нервная система активируется без торможения, что проявляется тахикардией, потливостью, тревогой."
    plain: "Один из нейромедиаторов отвечает за реакцию «бей или беги». Раньше каннабиноиды его тормозили. Сейчас тормоза сняты, и он работает на полную. Отсюда учащённый пульс, потливость, внутреннее напряжение. Это не опасно — просто нервная система перенастраивается."
  - day: 3
    scientific: "FAAH (fatty acid amide hydrolase) — фермент, расщепляющий анандамид. Его активность повышена после отмены THC, что снижает доступность эндогенных каннабиноидов в синапсе."
    plain: "В мозге есть фермент, который разрушает собственные каннабиноиды. После отмены он работает слишком активно — как будто система ещё не поняла, что внешнего вещества больше нет. Поэтому даже те молекулы, которые мозг производит сам, быстро исчезают. Через несколько дней активность фермента начнёт снижаться."
