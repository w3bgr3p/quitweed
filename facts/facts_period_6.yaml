period: 6
days: "61-90"
title: "Структурное восстановление"
facts:
  - day: 61
    scientific: "Плотность CB1-рецепторов в гиппокампе достигает уровня контрольной группы через 8-12 недель абстиненции, восстанавливая нормальную чувствительность к эндоканнабиноидам."
    plain: "Рецепторы в центре памяти вернулись к норме. Те самые замки которые THC открывал своим ключом теперь работают с твоими собственными молекулами. Память фиксируется естественно без внешней химии."
  - day: 62
    scientific: "Объём серого вещества в гиппокампе увеличивается на 5-8% после трёх месяцев абстиненции за счёт нейрогенеза в зубчатой извилине."
    plain: "В центре памяти растут новые нейроны. Буквально физически увеличивается объём ткани которая отвечает за запоминание. Это видно на МРТ как прирост серого вещества."
  - day: 63
    scientific: "Префронтальная кора восстанавливает толщину коры и плотность синаптических связей через 10-12 недель после прекращения употребления каннабиса."
    plain: "Лобные доли мозга которые отвечают за планирование и контроль восстановили структуру. Связи между нейронами стали плотнее. Решения принимаются с полным набором инструментов а не на ослабленном оборудовании."
  - day: 64
    scientific: "Базальный уровень дофамина в прилежащем ядре нормализуется через 90 дней абстиненции достигая показателей людей никогда не употреблявших каннабис."
    plain: "Центр удовольствия работает как у человека который никогда не курил. Дофамин выделяется в нормальных количествах от обычных вещей. Больше не нужен внешний стимул чтобы чувствовать что жизнь имеет вкус."
  - day: 65
    scientific: "Архитектура сна полностью восстанавливается включая нормальное соотношение фаз медленного и быстрого сна и физиологическую продолжительность REM-периодов."
    plain: "Сон стал таким каким должен быть. Глубокие фазы для восстановления тела быстрые для обработки эмоций. Просыпаешься отдохнувшим потому что мозг прошёл все нужные циклы а не застрял в одной фазе."
  - day: 66
    scientific: "CB2-рецепторы в микроглии и периферических иммунных клетках восстанавливают нормальную экспрессию регулируя воспалительный ответ без хронической супрессии."
    plain: "Иммунные клетки снова правильно реагируют на угрозы. THC подавлял воспаление везде включая там где оно нужно для защиты. Теперь иммунитет работает точечно а не вслепую."
  - day: 67
    scientific: "Эндоканнабиноидный тонус регулируется автономно через баланс синтеза анандамида и 2-AG и активность ферментов FAAH и MAGL без экзогенных агонистов."
    plain: "Твоя внутренняя система баланса работает сама. Производит нужные молекулы разрушает лишние поддерживает равновесие. Раньше THC ломал эту систему занимая все рецепторы. Сейчас она автономна."
  - day: 68
    scientific: "Рабочая память достигает показателей контрольной группы в тестах на удержание и манипуляцию информацией через 12 недель абстиненции."
    plain: "Можешь держать в голове несколько вещей одновременно и работать с ними. Номер телефона пока набираешь список покупок пока идёшь по магазину. Оперативная память мозга вернулась к полной ёмкости."
  - day: 69
    scientific: "Связь между амигдалой и префронтальной корой восстанавливается обеспечивая нормальную регуляцию эмоциональных реакций через нисходящий контроль."
    plain: "Центр эмоций и центр контроля снова разговаривают нормально. Когда возникает страх или злость лобные доли могут это регулировать. Не подавлять а именно управлять реакцией осознанно."
  - day: 70
    scientific: "Консолидация долгосрочной памяти в гиппокампе и неокортексе происходит без нарушений обеспечивая стабильное формирование автобиографических воспоминаний."
    plain: "События жизни записываются в долговременную память как надо. То что произошло вчера через месяц станет чётким воспоминанием а не размытым пятном. Твоя история снова пишется разборчиво."
  - day: 71
    scientific: "Нейротрофический фактор мозга BDNF достигает нормальных уровней в гиппокампе и префронтальной коре стимулируя синаптическую пластичность и нейрогенез."
    plain: "Белок который помогает нейронам расти и соединяться вернулся к норме. Это как удобрение для мозга. Новые связи формируются легче обучение идёт быстрее мозг снова пластичен."
  - day: 72
    scientific: "Глутаматергическая передача в префронтальной коре нормализуется восстанавливая баланс возбуждения и торможения критичный для когнитивного контроля."
    plain: "Главный возбуждающий сигнал мозга работает правильно. Нейроны активируются когда надо и затихают когда надо. Это основа концентрации и контроля. Раньше баланс был сдвинут теперь восстановлен."
  - day: 73
    scientific: "Плотность дендритных шипиков в пирамидных нейронах префронтальной коры восстанавливается через 10-12 недель абстиненции увеличивая синаптическую связность."
    plain: "На отростках нейронов выросли обратно маленькие выступы через которые приходят сигналы от других клеток. Больше выступов больше связей больше вычислительной мощности. Мозг стал плотнее упакован информацией."
  - day: 74
    scientific: "Метаболизм глюкозы в префронтальной коре и передней поясной коре нормализуется отражая восстановление энергетического обеспечения когнитивных процессов."
    plain: "Лобные доли получают нормальное количество энергии. Глюкоза поступает туда где нужно думать планировать контролировать. Раньше эти зоны работали на голодном пайке. Сейчас полный бак."
  - day: 75
    scientific: "Экспрессия генов связанных с синаптической пластичностью Arc и c-Fos возвращается к базовому уровню обеспечивая нормальную адаптацию нейронных сетей."
    plain: "Гены которые включаются когда мозг учится и меняется работают как надо. Каждый новый опыт оставляет правильный след. Нейронные сети перестраиваются под задачи а не застывают в одной конфигурации."
  - day: 76
    scientific: "Миелинизация аксонов в белом веществе префронтальной коры продолжается после прекращения воздействия THC восстанавливая скорость проведения сигналов."
    plain: "Изоляция на проводах между нейронами снова растёт. Сигналы идут быстрее без потерь. Это как апгрейд интернета с медленного на быстрый. Мысли формируются быстрее реакции точнее."
  - day: 77
    scientific: "Ось гипоталамус-гипофиз-надпочечники восстанавливает нормальную реактивность на стресс с адекватным выбросом кортизола и его последующим подавлением."
    plain: "Система стресса работает правильно. Угроза выброс гормона реакция затем успокоение. Раньше THC ломал этот цикл и стресс либо игнорировался либо зашкаливал. Сейчас реакция адекватна ситуации."
  - day: 78
    scientific: "Нейрогенез в субвентрикулярной зоне и зубчатой извилине гиппокампа происходит с нормальной скоростью обеспечивая пополнение пула нейронов."
    plain: "В двух зонах мозга рождаются новые нейроны с нормальной скоростью. Это редкая способность взрослого мозга. Новые клетки встраиваются в сети памяти и обоняния. Мозг обновляется изнутри."
  - day: 79
    scientific: "Серотонинергическая система восстанавливает нормальную плотность 5-HT рецепторов и базальный уровень серотонина в префронтальной коре и гиппокампе."
    plain: "Система настроения и спокойствия вернулась к норме. Серотонин выделяется правильно рецепторы его принимают правильно. Фон настроения стабилен без резких провалов и без искусственных подпорок."
  - day: 80
    scientific: "Функциональная связность между дорсолатеральной префронтальной корой и задней теменной корой восстанавливается обеспечивая нормальную работу сети исполнительного контроля."
    plain: "Две ключевые зоны мозга снова работают синхронно. Одна планирует другая обрабатывает информацию. Вместе они дают способность решать сложные задачи удерживать цели фильтровать лишнее. Сеть контроля снова онлайн."
