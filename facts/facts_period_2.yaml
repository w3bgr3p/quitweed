period: 2
days: "4-7"
title: "Ранняя адаптация"
facts:
  - day: 4
    scientific: "Мезолимбический дофаминовый путь (VTA → nucleus accumbens) демонстрирует сниженную базальную активность после отмены хронической стимуляции CB1-рецепторов."
    plain: "Путь удовольствия в мозге работает вполсилы. Обычные вещи — еда, музыка, общение — не дают прежнего отклика. THC годами усиливал этот путь искусственно. Сейчас система перестраивается на работу без внешней поддержки."
  - day: 5
    scientific: "REM-фаза сна увеличивается компенсаторно после снятия подавления CB1-агонистами — феномен REM rebound с интенсификацией сновидений."
    plain: "Сны становятся яркими и странными. Каннабиноиды подавляли быструю фазу сна годами. Мозг компенсирует потерянное — сновидения становятся длиннее и насыщеннее. Это временный эффект восстановления нормального цикла."
  - day: 6
    scientific: "5-HT1A и 5-HT2A рецепторы серотониновой системы демонстрируют дисбаланс после отмены модуляции эндоканнабиноидами, влияя на настроение и тревожность."
    plain: "Система настроения разбалансирована. Серотонин регулирует эмоции и тревогу. Каннабиноиды влияли на его работу через общие механизмы. Сейчас серотониновые рецепторы перенастраиваются на автономный режим без внешнего вмешательства."
  - day: 7
    scientific: "Nucleus accumbens показывает сниженную реакцию на естественные награды из-за десенситизации дофаминовых D2-рецепторов."
    plain: "Центр вознаграждения в мозге стал менее чувствительным. Рецепторы, отвечающие за удовольствие, привыкли к постоянной стимуляции. Обычные радости кажутся пресными. Чувствительность восстанавливается постепенно — рецепторы учатся реагировать на естественные стимулы."
  - day: 8
    scientific: "Префронтальная кора испытывает дефицит дофаминовой модуляции, что снижает мотивацию и исполнительный контроль через D1-рецепторы."
    plain: "Сложно заставить себя делать даже простые дела. Лобная кора управляет планированием и мотивацией через дофамин. Его уровень снижен. Это не лень — это временная нехватка нейрохимического топлива для волевых усилий."
