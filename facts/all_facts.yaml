periods:
- period: 1
  days: 1-3
  title: Острая фаза
  facts:
  - day: 1
    scientific: CB1-рецепторы после хронической стимуляции THC находятся в состоянии
      downregulation — их плотность на мембране снижена на 20-60%. Процесс апрегуляции
      занимает 2-4 недели.
    plain: Рецепторы в мозге, которые реагировали на THC, сейчас частично отключены
      — их стало меньше. Это защитная реакция на постоянную перегрузку. Сейчас они
      начинают возвращаться, но процесс медленный. Поэтому первые дни ощущаются особенно
      остро — система работает вполсилы.
  - day: 2
    scientific: Норадреналин в префронтальной коре и миндалине не подавляется эндоканнабиноидами.
      Симпатическая нервная система активируется без торможения, что проявляется тахикардией,
      потливостью, тревогой.
    plain: Один из нейромедиаторов отвечает за реакцию «бей или беги». Раньше каннабиноиды
      его тормозили. Сейчас тормоза сняты, и он работает на полную. Отсюда учащённый
      пульс, потливость, внутреннее напряжение. Это не опасно — просто нервная система
      перенастраивается.
  - day: 3
    scientific: FAAH (fatty acid amide hydrolase) — фермент, расщепляющий анандамид.
      Его активность повышена после отмены THC, что снижает доступность эндогенных
      каннабиноидов в синапсе.
    plain: В мозге есть фермент, который разрушает собственные каннабиноиды. После
      отмены он работает слишком активно — как будто система ещё не поняла, что внешнего
      вещества больше нет. Поэтому даже те молекулы, которые мозг производит сам,
      быстро исчезают. Через несколько дней активность фермента начнёт снижаться.
- period: 2
  days: 4-7
  title: Ранняя адаптация
  facts:
  - day: 4
    scientific: Мезолимбический дофаминовый путь (VTA → nucleus accumbens) демонстрирует
      сниженную базальную активность после отмены хронической стимуляции CB1-рецепторов.
    plain: Путь удовольствия в мозге работает вполсилы. Обычные вещи — еда, музыка,
      общение — не дают прежнего отклика. THC годами усиливал этот путь искусственно.
      Сейчас система перестраивается на работу без внешней поддержки.
  - day: 5
    scientific: REM-фаза сна увеличивается компенсаторно после снятия подавления CB1-агонистами
      — феномен REM rebound с интенсификацией сновидений.
    plain: Сны становятся яркими и странными. Каннабиноиды подавляли быструю фазу
      сна годами. Мозг компенсирует потерянное — сновидения становятся длиннее и насыщеннее.
      Это временный эффект восстановления нормального цикла.
  - day: 6
    scientific: 5-HT1A и 5-HT2A рецепторы серотониновой системы демонстрируют дисбаланс
      после отмены модуляции эндоканнабиноидами, влияя на настроение и тревожность.
    plain: Система настроения разбалансирована. Серотонин регулирует эмоции и тревогу.
      Каннабиноиды влияли на его работу через общие механизмы. Сейчас серотониновые
      рецепторы перенастраиваются на автономный режим без внешнего вмешательства.
  - day: 7
    scientific: Nucleus accumbens показывает сниженную реакцию на естественные награды
      из-за десенситизации дофаминовых D2-рецепторов.
    plain: Центр вознаграждения в мозге стал менее чувствительным. Рецепторы, отвечающие
      за удовольствие, привыкли к постоянной стимуляции. Обычные радости кажутся пресными.
      Чувствительность восстанавливается постепенно — рецепторы учатся реагировать
      на естественные стимулы.
  - day: 8
    scientific: Префронтальная кора испытывает дефицит дофаминовой модуляции, что
      снижает мотивацию и исполнительный контроль через D1-рецепторы.
    plain: Сложно заставить себя делать даже простые дела. Лобная кора управляет планированием
      и мотивацией через дофамин. Его уровень снижен. Это не лень — это временная
      нехватка нейрохимического топлива для волевых усилий.
- period: 3
  days: 8-14
  title: Стабилизация
  facts:
  - day: 8
    scientific: BDNF (brain-derived neurotrophic factor) активирует TrkB-рецепторы
      в гиппокампе, запуская каскад MAPK/ERK и стимулируя нейрогенез в зубчатой извилине.
    plain: В гиппокампе — части мозга отвечающей за память — начинают расти новые
      нейроны. Это происходит благодаря белку BDNF который работает как удобрение
      для нервных клеток. THC подавлял этот процесс. Теперь мозг восстанавливает способность
      формировать новые воспоминания и учиться.
  - day: 9
    scientific: 'CB1-рецепторы проходят апрегуляцию: увеличивается их плотность на
      пресинаптических терминалях базальных ганглиев и префронтальной коры.'
    plain: Рецепторы которые реагировали на THC возвращаются на свои места в мозге.
      Их количество растёт в зонах отвечающих за движение и принятие решений. Мозг
      перестраивает чувствительность к собственным сигнальным молекулам после того
      как внешнее вещество перестало их заменять.
  - day: 10
    scientific: 'Норадреналиновая система locus coeruleus восстанавливает базальный
      тонус: нормализуется выброс норадреналина в кору и гиппокамп.'
    plain: Голубое пятно — крошечная область в стволе мозга — снова начинает правильно
      дозировать норадреналин. Это вещество управляет бодростью вниманием и реакцией
      на стресс. THC нарушал его баланс. Сейчас возвращается способность концентрироваться
      без перевозбуждения.
  - day: 11
    scientific: Дорсолатеральная префронтальная кора восстанавливает связи с гиппокампом
      через cingulum bundle, улучшая консолидацию рабочей памяти.
    plain: Лобная кора налаживает связь с центром памяти. Это позволяет удерживать
      информацию в голове пока ты её используешь — номер телефона список покупок шаги
      решения задачи. THC разрывал эти связи. Теперь ты можешь заметить что легче
      держать мысль и не терять нить разговора.
  - day: 12
    scientific: Глутаматные AMPA-рецепторы увеличивают проводимость в синапсах CA3-CA1
      гиппокампа, усиливая долговременную потенциацию (LTP).
    plain: Синапсы — контакты между нейронами — становятся эффективнее. Когда один
      нейрон активирует другой связь между ними укрепляется. Это основа обучения и
      памяти. THC ослаблял этот процесс делая сложнее запоминать новое. Сейчас мозг
      восстанавливает способность формировать прочные воспоминания.
  - day: 13
    scientific: GABA-ергические интернейроны восстанавливают ингибиторный контроль
      над пирамидными нейронами неокортекса, стабилизируя баланс возбуждения-торможения.
    plain: Тормозные нейроны снова контролируют активность основных клеток коры. Они
      работают как регулятор громкости не давая мозгу перевозбуждаться. THC нарушал
      этот баланс создавая либо заторможенность либо тревожность. Теперь нервная система
      находит равновесие между активностью и покоем.
  - day: 14
    scientific: Префронтальная кора восстанавливает глутаматергические проекции к
      nucleus accumbens, модулируя дофаминовый ответ на естественные награды.
    plain: Лобная кора снова управляет центром удовольствия. Она помогает оценивать
      стоит ли что-то усилий и контролирует импульсы. THC обходил эту систему напрямую
      активируя награду. Сейчас возвращается способность получать удовольствие от
      обычных вещей — еды общения достижений — без внешнего стимула.
  - day: 15
    scientific: Астроциты гиппокампа увеличивают захват глутамата через EAAT2-транспортеры,
      предотвращая эксайтотоксичность и поддерживая синаптический гомеостаз.
    plain: Вспомогательные клетки мозга очищают пространство между нейронами от избытка
      сигнальных молекул. Это защищает нейроны от перегрузки и поддерживает стабильную
      работу. THC нарушал этот процесс. Теперь мозг лучше справляется с нагрузкой
      и восстанавливается после стресса.
  - day: 16
    scientific: Серотониновые 5-HT1A-рецепторы в дорсальном ядре шва восстанавливают
      ауторегуляцию, нормализуя серотонинергический тонус в лимбической системе.
    plain: Система серотонина настраивает сама себя. Рецепторы в стволе мозга определяют
      сколько серотонина нужно выбросить в эмоциональные центры. THC сбивал эту настройку.
      Сейчас возвращается стабильность настроения — меньше резких перепадов от апатии
      к раздражению.
  - day: 17
    scientific: Митохондрии нейронов префронтальной коры увеличивают продукцию АТФ
      через окислительное фосфорилирование, восстанавливая энергетический метаболизм.
    plain: Энергетические станции нейронов работают эффективнее. Они производят топливо
      для работы мозга — особенно в зонах отвечающих за планирование и самоконтроль.
      THC снижал их производительность. Теперь ты можешь заметить что думать стало
      легче а умственная усталость наступает позже.
  - day: 18
    scientific: Олигодендроциты усиливают миелинизацию аксонов в белом веществе префронтальной
      коры, ускоряя проведение потенциалов действия между ассоциативными зонами.
    plain: Изоляция на нервных волокнах становится плотнее. Это ускоряет передачу
      сигналов между разными областями мозга. THC замедлял этот процесс особенно в
      зонах отвечающих за сложное мышление. Сейчас мысли текут быстрее а связи между
      идеями становятся очевиднее.
- period: 4
  days: 15-30
  title: Психологическая реадаптация
  facts:
  - day: 15
    scientific: Префронтальная кора восстанавливает тормозной контроль над амигдалой
      через GABA-ергические проекции, снижая эмоциональную реактивность на триггеры.
    plain: Лобные доли мозга заново учатся тормозить миндалевидное тело — центр тревоги
      и импульсов. Раньше THC делал это за них. Теперь связи восстанавливаются, и
      ты можешь сознательно останавливать автоматические реакции на стресс или желание.
  - day: 16
    scientific: Условный рефлекс на каннабис формируется через долговременную потенциацию
      в гиппокампе, связывая контекст с выбросом дофамина.
    plain: 'Мозг запомнил: определённое место, время суток, компания — и следом приходило
      вознаграждение. Эти связи записаны физически, как протоптанные тропинки между
      нейронами. Сейчас они слабеют, потому что вознаграждения больше нет.'
  - day: 17
    scientific: Кортизол и кортикотропин-рилизинг фактор активируют дофаминовые нейроны
      VTA при стрессе, провоцируя тягу к веществу.
    plain: Стресс запускает гормон кортизол, который будит систему вознаграждения.
      Мозг ищет быстрое решение — то, что раньше помогало. Поэтому в напряжённые дни
      тяга возвращается волнами, даже если ты уже забыл о веществе.
  - day: 18
    scientific: Ангедония при отмене связана со снижением тонической активности дофаминовых
      нейронов в nucleus accumbens.
    plain: Центр удовольствия работает на пониженных оборотах. То, что раньше радовало
      — музыка, еда, общение — кажется пресным. Это не депрессия, а временное снижение
      фоновой активности нейронов. Они восстанавливают чувствительность.
  - day: 19
    scientific: Долговременная потенциация и депрессия синапсов в префронтальной коре
      перестраивают нейронные сети, отвечающие за принятие решений.
    plain: Связи между нейронами усиливаются или слабеют в зависимости от того, как
      часто ты их используешь. Каждый раз, когда ты выбираешь не курить, ты физически
      укрепляешь новую нейронную цепь. Старая — слабеет.
  - day: 20
    scientific: Эндогенные опиоиды — бета-эндорфин и энкефалины — модулируют настроение
      через mu- и delta-рецепторы в прилежащем ядре.
    plain: Твой мозг производит собственные обезболивающие и молекулы радости. Они
      выделяются при физической нагрузке, смехе, прикосновениях. THC подавлял их выработку.
      Сейчас система перезапускается, но ей нужно время.
  - day: 21
    scientific: Серотонин в орбитофронтальной коре регулирует импульсивность через
      5-HT2A и 5-HT1A рецепторы.
    plain: Серотонин помогает взвешивать последствия до действия. При отмене его баланс
      нарушен — отсюда импульсивные решения, раздражительность, нетерпеливость. Рецепторы
      восстанавливают чувствительность, и контроль возвращается.
  - day: 22
    scientific: Инсула интегрирует интероцептивные сигналы тела и формирует субъективное
      ощущение тяги как телесную потребность.
    plain: Островковая доля мозга переводит сигналы тела в ощущения. Тяга ощущается
      как голод, напряжение в груди, беспокойство в животе. Это не реальная потребность
      — это мозг интерпретирует старые сигналы. Со временем он переучивается.
  - day: 23
    scientific: Амигдала усиливает реакцию на негативные стимулы при дефиците эндоканнабиноидов,
      повышая тревожность.
    plain: Миндалевидное тело отвечает за страх и тревогу. Без THC оно работает на
      повышенных оборотах — мир кажется более угрожающим, мелочи раздражают сильнее.
      Это временная гиперчувствительность, пока собственная система не восстановится.
  - day: 24
    scientific: Циркадные ритмы регулируются супрахиазматическим ядром через мелатонин
      и кортизол, нарушенные хроническим употреблением THC.
    plain: Внутренние часы сбиты. THC влиял на выработку мелатонина — гормона сна.
      Сейчас мозг заново учится засыпать и просыпаться в правильное время. Первые
      недели сон может быть рваным, но ритм восстанавливается.
  - day: 25
    scientific: Митохондрии нейронов восстанавливают эффективность окислительного
      фосфорилирования после хронического окислительного стресса.
    plain: Энергетические станции клеток мозга работали в режиме перегрузки. Теперь
      они ремонтируются — восстанавливают способность производить энергию эффективно.
      Поэтому ясность мышления возвращается постепенно, а не сразу.
  - day: 26
    scientific: Нейровоспаление при отмене опосредовано микроглией и провоспалительными
      цитокинами — IL-1β, TNF-α.
    plain: Иммунные клетки мозга активированы и выделяют сигнальные молекулы воспаления.
      Это защитная реакция на изменения. Проявляется как туман в голове, усталость,
      раздражительность. Воспаление спадает по мере стабилизации.
  - day: 27
    scientific: Ось HPA восстанавливает отрицательную обратную связь через глюкокортикоидные
      рецепторы в гиппокампе.
    plain: Система стресса училась отключаться сама, когда опасность прошла. THC нарушил
      этот механизм. Сейчас мозг заново настраивает тормоза — учится останавливать
      выброс гормонов стресса, когда они больше не нужны.
  - day: 28
    scientific: Окситоцин усиливает социальную мотивацию через рецепторы в прилежащем
      ядре и снижает активность амигдалы.
    plain: Гормон привязанности делает общение приятным и снижает тревогу. THC подавлял
      его эффекты. Теперь контакт с людьми, объятия, разговоры начинают приносить
      настоящее удовлетворение — не через вещество, а напрямую.
  - day: 29
    scientific: Эндоканнабиноидная система регулирует аппетит через CB1-рецепторы
      в гипоталамусе и лептиновый сигналинг.
    plain: Система, управляющая голодом, была перегружена внешним THC. Сейчас она
      перекалибруется. Аппетит может скакать — то отсутствует, то волчий. Это временно,
      пока мозг не научится снова чувствовать сытость и голод естественно.
  - day: 30
    scientific: Дофаминовые рецепторы D2 в стриатуме восстанавливают плотность и чувствительность
      после даунрегуляции.
    plain: Рецепторы удовольствия были заглушены, потому что THC постоянно стимулировал
      выброс дофамина. Мозг защищался, снижая их количество. Теперь они возвращаются
      — и с ними возвращается способность радоваться обычным вещам.
  - day: 31
    scientific: Глутаматергическая передача в префронтальной коре усиливается через
      NMDA-рецепторы, улучшая рабочую память.
    plain: 'Главный возбуждающий сигнал мозга восстанавливает силу. Это основа концентрации,
      памяти, планирования. Раньше THC тормозил эти процессы. Сейчас связи укрепляются,
      и ты замечаешь: легче удерживать мысль, доводить дело до конца.'
  - day: 32
    scientific: Нейротрофический фактор мозга BDNF стимулирует рост новых синапсов
      в гиппокампе и префронтальной коре.
    plain: Белок роста нервной ткани запускает строительство новых связей между нейронами.
