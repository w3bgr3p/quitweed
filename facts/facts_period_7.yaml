period: 7
days: "90+"
title: "Долгосрочная стабилизация"
facts:
  - day: 90
    scientific: "CB1-рецепторы после длительной абстиненции восстанавливают плотность до 95-100% от нормы в префронтальной коре, что коррелирует с улучшением исполнительных функций."
    plain: "Рецепторы в лобной доле мозга почти полностью восстановились. Это те самые структуры которые отвечают за планирование, контроль импульсов и принятие решений. Теперь они работают как у человека который никогда не курил."
  - day: 91
    scientific: "Миелинизация аксонов в белом веществе продолжается до 3-5 лет после прекращения употребления, улучшая скорость передачи сигналов между корой и подкорковыми структурами."
    plain: "Нервные волокна обрастают защитной оболочкой которая ускоряет передачу сигналов. Процесс идёт годами. Мысли становятся быстрее, реакции точнее, связь между разными частями мозга крепче."
  - day: 92
    scientific: "FAAH (фермент деградации анандамида) нормализует активность, что увеличивает время жизни эндоканнабиноидов в синаптической щели и усиливает естественную регуляцию настроения."
    plain: "Фермент который разрушает собственные молекулы удовольствия теперь работает правильно. Они дольше остаются активными и лучше выполняют свою работу. Настроение стабилизируется без внешних веществ."
  - day: 93
    scientific: "Гиппокампальный нейрогенез восстанавливается до базового уровня через 6-12 месяцев, что улучшает консолидацию новых эпизодических воспоминаний."
    plain: "Рождение новых нейронов в центре памяти вернулось к норме. Ты лучше запоминаешь события, лица, разговоры. Новая информация укладывается в долговременную память как положено."
  - day: 94
    scientific: "BDNF (нейротрофический фактор мозга) достигает нормальных концентраций в гиппокампе и префронтальной коре, поддерживая синаптическую пластичность и выживаемость нейронов."
    plain: "Белок который питает нейроны и помогает им создавать новые связи вернулся к нормальному уровню. Мозг снова может эффективно учиться, адаптироваться и восстанавливаться после стресса."
  - day: 95
    scientific: "Дофаминовые D2-рецепторы в стриатуме восстанавливают плотность до 90-95% от нормы, что снижает импульсивность и улучшает оценку отложенного вознаграждения."
    plain: "Рецепторы дофамина в центре мотивации почти полностью восстановились. Ты лучше контролируешь импульсы и можешь ждать большего результата вместо мгновенного удовольствия. Долгосрочные цели становятся реальнее."
  - day: 96
    scientific: "Глутаматергическая передача в кортико-стриатных путях нормализуется, восстанавливая баланс между целенаправленным и привычным поведением."
    plain: "Связь между корой и центрами привычек работает правильно. Ты меньше действуешь на автопилоте и больше осознанно выбираешь. Старые паттерны теряют власть, новые привычки закрепляются легче."
  - day: 97
    scientific: "Астроциты восстанавливают нормальную морфологию и плотность глиальных отростков, улучшая метаболическую поддержку нейронов и регуляцию внеклеточного глутамата."
    plain: "Вспомогательные клетки мозга которые кормят нейроны и убирают лишние сигнальные молекулы вернулись в форму. Нейроны получают лучшее питание, а перевозбуждение контролируется эффективнее."
  - day: 98
    scientific: "2-AG (2-арахидоноилглицерол) — основной эндоканнабиноид по концентрации, синтезируется в постсинаптических нейронах и действует ретроградно, подавляя высвобождение нейромедиаторов."
    plain: "Главная сигнальная молекула твоей собственной системы каннабиноидов работает как тормоз. Она движется в обратном направлении и говорит соседним клеткам: хватит, сигнала достаточно. Это защита от перегрузки."
  - day: 99
    scientific: "Митохондриальная функция в нейронах нормализуется, увеличивая производство АТФ и снижая окислительный стресс, что улучшает общую энергетику мозга."
    plain: "Энергетические станции внутри нейронов работают на полную мощность. Мозг получает больше топлива для мышления, меньше накапливается повреждающих молекул. Ясность и выносливость ума растут."
  - day: 100
    scientific: "Серотонинергические проекции из ядер шва к коре восстанавливают нормальную плотность, что стабилизирует циркадные ритмы и эмоциональную регуляцию."
    plain: "Пути серотонина от ствола мозга к коре восстановились. Сон и бодрствование следуют естественному ритму, настроение стабильнее в течение дня. Эмоции не скачут без причины."
  - day: 101
    scientific: "Норадренергическая система восстанавливает чувствительность альфа-2 и бета-адренорецепторов, улучшая внимание, бдительность и стрессоустойчивость."
    plain: "Система норадреналина которая отвечает за концентрацию и реакцию на стресс работает правильно. Ты лучше фокусируешься на задачах, быстрее замечаешь важное, спокойнее реагируешь на давление."
  - day: 102
    scientific: "Эндоканнабиноидный тонус в миндалине нормализуется, снижая гиперреактивность на угрожающие стимулы и уменьшая тревожность."
    plain: "Центр страха в мозге перестал быть сверхчувствительным. Обычные ситуации больше не запускают тревогу как раньше. Ты реагируешь на реальную угрозу, а не на её тень."
  - day: 103
    scientific: "Синаптическая обрезка (pruning) в подростковом и молодом возрасте завершается к 25 годам; длительное употребление THC может нарушить этот процесс, но после прекращения компенсаторные механизмы частично восстанавливают эффективность сетей."
    plain: "Если ты начал курить до 25 лет, мозг обрезал связи неправильно. Часть эффективности потеряна навсегда, но мозг нашёл обходные пути. Сейчас эти новые маршруты работают всё лучше."
  - day: 104
    scientific: "CB2-рецепторы в микроглии регулируют нейровоспаление; их активность нормализуется после абстиненции, снижая хроническое воспаление в ЦНС."
    plain: "Рецепторы на иммунных клетках мозга перестали поддерживать постоянное воспаление. Мозг меньше раздражён изнутри. Это улучшает работу всех систем и снижает риск долгосрочных повреждений."
  - day: 105
    scientific: "Префронтальная кора восстанавливает контроль над вентральной тегментальной областью, нормализуя дофаминовый ответ на естественные награды."
    plain: "Лобная доля снова командует центром удовольствия. Дофамин выделяется на еду, секс, достижения, а не только на вещества. Жизнь возвращает вкус без химического усилителя."
  - day: 106
    scientific: "Эндоканнабиноидная система участвует в extinction learning — процессе угасания условных страхов; её восстановление улучшает способность переучиваться после травматического опыта."
    plain: "Система которая помогает забывать старые страхи работает снова. Если у тебя была травма или сильная тревога, мозг теперь может переписать эти воспоминания. Прошлое меньше управляет настоящим."
  - day: 107
    scientific: "Холинергическая система восстанавливает нормальную активность в базальных ядрах переднего мозга, улучшая внимание, обучение и консолидацию памяти."
    plain: "Система ацетилхолина которая включает внимание и записывает память работает как надо. Ты лучше концентрируешься, быстрее учишься, крепче запоминаешь. Информация укладывается и остаётся."
  - day: 108
    scientific: "Оксидативный стресс в нейронах снижается до базового уровня через 12+ месяцев, что уменьшает накопление повреждённых белков и липидов."
    plain: "Агрессивные молекулы которые повреждали клетки мозга больше не накапливаются. Нейроны чище, здоровее, живут дольше. Это долгосрочная защита от деградации."
  - day: 109
    scientific: "Нейропластичность достигает нового гомеостаза: мозг адаптировался к отсутствию экзогенных каннабиноидов и функционирует на основе эндогенной регуляции."
    plain: "Мозг построил новую нормальность. Он больше не ждёт THC извне и полностью полагается на собственные молекулы. Это устойчивое состояние. Ты живёшь на собственной химии."
