period: 5
days: "31-60"
title: "Когнитивное восстановление"
facts:
  - day: 31
    scientific: "Дорсолатеральная префронтальная кора восстанавливает связность с париетальными областями, что улучшает производительность в задачах на рабочую память."
    plain: "Область мозга отвечающая за удержание информации в голове снова работает в полную силу. Ты можешь держать в уме несколько задач одновременно, не теряя нить разговора, помнить зачем открыл вкладку. Это не возвращение к норме — это восстановление способности которую THC подавлял годами."
  - day: 32
    scientific: "Инфралимбическая кора усиливает тормозной контроль над миндалевидным телом через GABAергические интернейроны, снижая импульсивность."
    plain: "Участок коры который тормозит импульсы снова может сказать нет автоматическим реакциям. Ты замечаешь желание но не действуешь мгновенно. Между стимулом и действием появляется пауза в которой ты принимаешь решение. Это основа самоконтроля."
  - day: 33
    scientific: "Нейрогенез в зубчатой извилине гиппокампа достигает пика, новые гранулярные нейроны интегрируются в существующие сети распознавания паттернов."
    plain: "В центре памяти рождаются новые нейроны и встраиваются в сети. Ты лучше различаешь похожие ситуации, не путаешь где оставил ключи вчера и позавчера. Мозг снова умеет создавать чёткие отдельные воспоминания вместо размытой каши."
  - day: 34
    scientific: "Олигодендроциты завершают ремиелинизацию аксонов в белом веществе лобных долей, ускоряя проведение потенциалов действия."
    plain: "Изоляция на проводах между нейронами восстановлена. Сигналы идут быстрее — ты быстрее соображаешь, быстрее находишь слова, быстрее переключаешься между задачами. Скорость мышления которую ты считал нормой возвращается."
  - day: 35
    scientific: "Плотность дофаминовых D2-рецепторов в стриатуме возвращается к базовому уровню, восстанавливая чувствительность системы вознаграждения."
    plain: "Рецепторы дофамина которые THC заставлял прятаться вернулись на поверхность клеток. Обычные вещи снова приносят удовольствие — еда вкуснее, музыка трогает, достижения радуют. Мозг снова слышит сигналы удовольствия на нормальной громкости."
  - day: 36
    scientific: "Базовый уровень анандамида в синаптической щели стабилизируется за счёт баланса между синтезом NAPE-PLD и деградацией FAAH."
    plain: "Собственный каннабиноид мозга выходит на стабильный уровень. Два фермента — один создаёт его, другой разрушает — нашли баланс. Ты чувствуешь спокойное фоновое благополучие без внешних веществ. Это то что мозг делает сам когда ему не мешают."
  - day: 37
    scientific: "Ось гипоталамус-гипофиз-надпочечники нормализует циркадный ритм кортизола с пиком в утренние часы и спадом к вечеру."
    plain: "Система стресса снова работает по расписанию. Утром кортизол поднимается и даёт энергию проснуться, вечером падает и позволяет уснуть. Стресс перестал быть постоянным фоном — он приходит когда нужен и уходит когда задача решена."
  - day: 38
    scientific: "Быстрый сон удлиняется, усиливая консолидацию эпизодической памяти через реактивацию гиппокампальных энграмм в неокортексе."
    plain: "Фаза сна со сновидениями стала длиннее. В ней мозг переписывает дневные события из временного хранилища в долговременное. Ты лучше помнишь что было вчера, легче учишь новое, воспоминания не испаряются к обеду. Сон снова делает свою работу."
  - day: 39
    scientific: "Долгосрочное потенцирование в синапсах CA1-области гиппокампа восстанавливается через усиление AMPA-рецепторов, улучшая формирование ассоциативной памяти."
    plain: "Связи между нейронами в центре памяти снова умеют усиливаться надолго. Когда два события происходят вместе мозг запоминает связь. Ты помнишь где встречал человека, что обсуждали в прошлый раз, какой метод сработал в похожей задаче. Память снова ассоциативная а не фрагментарная."
  - day: 40
    scientific: "Серотонинергические проекции из ядер шва к префронтальной коре стабилизируются, выравнивая аффективные колебания."
    plain: "Нейроны которые поставляют серотонин в кору снова работают ровно. Настроение перестало скакать от подъёма к спаду без причины. Ты чувствуешь эмоции но они пропорциональны событиям. Это не счастье — это стабильность на которой можно строить."
  - day: 41
    scientific: "Орбитофронтальная кора восстанавливает гибкое переключение между стратегиями через обновление моделей ожидаемой ценности."
    plain: "Участок мозга отвечающий за смену планов снова работает. Когда старый подход не работает ты замечаешь это и пробуешь другой. Не застреваешь в бесполезных попытках, не повторяешь ошибки по инерции. Гибкость мышления вернулась."
  - day: 42
    scientific: "Норадренергический тонус в теменной коре нормализуется, восстанавливая устойчивость произвольного внимания к отвлекающим стимулам."
    plain: "Норадреналин в зонах внимания вышел на рабочий уровень. Ты можешь сосредоточиться на задаче даже когда вокруг шум. Отвлекающие стимулы не выбивают из колеи автоматически. Внимание снова под твоим контролем а не под контролем окружения."
  - day: 43
    scientific: "Эндогенные опиоиды — бета-эндорфин и энкефалины — восстанавливают чувствительность мю-рецепторов в прилежащем ядре, возвращая гедонический отклик на естественные награды."
    plain: "Собственные опиаты мозга снова вызывают удовольствие. Рецепторы которые прятались от перегрузки вернулись. Еда, секс, физическая активность, социальный контакт приносят тёплое удовлетворение. Мозг снова умеет радоваться простым вещам без химического костыля."
  - day: 44
    scientific: "BDNF в гиппокампе и префронтальной коре достигает пикового уровня, стимулируя синаптогенез и дендритное ветвление."
    plain: "Белок роста нервной ткани на максимуме. Нейроны выращивают новые отростки и создают новые связи. Мозг не просто восстанавливается — он строит новые пути. Это физическая основа для новых привычек, навыков, способов думать."
  - day: 45
    scientific: "Глутаматергическая передача в дорсомедиальной префронтальной коре усиливается, улучшая мониторинг конфликтов и детекцию ошибок."
    plain: "Зона мозга которая замечает противоречия и ошибки снова чувствительна. Ты ловишь себя на несоответствиях, замечаешь когда действие расходится с намерением, видишь ошибку до того как она стала проблемой. Внутренний контроль качества работает."
  - day: 46
    scientific: "Астроциты восстанавливают эффективность глутамат-глутаминового цикла, предотвращая эксайтотоксичность и стабилизируя нейротрансмиссию."
    plain: "Клетки-помощники нейронов снова быстро убирают лишний глутамат из щелей между нейронами. Это предотвращает перевозбуждение и защищает от повреждений. Нервная система работает чисто — сигналы чёткие, без шума, без токсичных накоплений."
  - day: 47
    scientific: "Каннабиноидные CB1-рецепторы на GABAергических интернейронах восстанавливают тормозной контроль над возбуждающими пирамидными нейронами."
    plain: "Рецепторы на тормозных нейронах вернулись к работе. Они контролируют активность основных нейронов — не дают им перевозбуждаться. Мозг снова умеет тормозить сам себя. Это защита от тревоги, навязчивых мыслей, эмоциональных штормов."
  - day: 48
    scientific: "Митохондриальная функция в нейронах гиппокампа нормализуется, увеличивая производство АТФ и поддерживая энергозатратные процессы синаптической пластичности."
    plain: "Энергостанции нейронов в центре памяти работают на полную мощность. Достаточно энергии для создания и поддержания новых связей. Обучение и запоминание больше не истощают — мозг может позволить себе тратить ресурсы на рост."
  - day: 49
    scientific: "Префронтальный контроль над амигдалой усиливается через укрепление возбуждающих проекций, снижая реактивность на условные стимулы связанные с употреблением."
    plain: "Кора снова может успокоить миндалевидное тело когда оно реагирует на триггеры. Запахи, места, люди связанные с употреблением вызывают реакцию но она не захлёстывает. Между импульсом и действием есть пространство для решения."
  - day: 50
    scientific: "Нейрональная осцилляция в гамма-диапазоне в префронтальной коре усиливается, улучшая интеграцию информации и рабочую память."
    plain: "Быстрые ритмы активности нейронов в коре восстановлены. Разные участки мозга синхронизируются и обмениваются информацией эффективно. Ты можешь держать в голове сложную задачу со всеми деталями, связывать информацию из разных источников, видеть картину целиком."
  - day: 51
    scientific: "Ацетилхолинергическая передача из базального ядра Мейнерта к неокортексу нормализуется, восстанавливая внимание к новизне и обучение."
    plain: "Нейроны которые поставляют ацетилхолин в кору снова активны. Этот медиатор включает внимание когда появляется что-то новое и помогает запоминать. Ты замечаешь детали, легче учишься, новая информация закрепляется с первого раза."
  - day: 52
    scientific: "Экспрессия генов раннего ответа c-Fos и Arc в гиппокампе нормализуется, обеспечивая молекулярную основу для консолидации памяти."
    plain: "Гены которые запускаются при обучении снова работают правильно. Когда ты что-то запоминаешь эти гены включаются и строят новые белки для укрепления связей. Воспоминания перестают быть хрупкими — они закрепляются и остаются."
  - day: 53
    scientific: "Глимфатическая система восстанавливает эффективность ночного клиренса метаболитов из интерстициального пространства мозга."
    plain: "Дренажная система мозга которая работает во сне снова чистит эффективно. За ночь вымываются токсичные отходы накопленные за день. Ты просыпаешься с ясной головой, мозг не работает через туман. Сон снова восстанавливает а не просто прерывает усталость."
  - day: 54
    scientific: "Нейропластичность моторной коры усиливается, улучшая координацию и обучение новым двигательным навыкам через укрепление кортикоспинальных путей."
    plain: "Зона мозга отвечающая за движения снова гибкая. Новые движения даются легче, координация точнее, мышечная память формируется быстрее. Спорт, музыкальный инструмент, любой навык требующий точности рук — всё это снова поддаётся тренировке."
  - day: 55
    scientific: "Интероцептивная точность — способность инсулы корректно интерпретировать сигналы от тела — восстанавливается, улучшая осознание внутренних состояний."
    plain: "Участок коры который читает сигналы от тела снова точен. Ты различаешь голод и тревогу, усталость и скуку, напряжение и возбуждение. Понимаешь что именно чувствует тело и что ему нужно. Это основа для заботы о себе без угадывания."
