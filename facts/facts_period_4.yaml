period: 4
days: "15-30"
title: "Психологическая реадаптация"
facts:
  - day: 15
    scientific: "Префронтальная кора восстанавливает тормозной контроль над амигдалой через GABA-ергические проекции, снижая эмоциональную реактивность на триггеры."
    plain: "Лобные доли мозга заново учатся тормозить миндалевидное тело — центр тревоги и импульсов. Раньше THC делал это за них. Теперь связи восстанавливаются, и ты можешь сознательно останавливать автоматические реакции на стресс или желание."
  - day: 16
    scientific: "Условный рефлекс на каннабис формируется через долговременную потенциацию в гиппокампе, связывая контекст с выбросом дофамина."
    plain: "Мозг запомнил: определённое место, время суток, компания — и следом приходило вознаграждение. Эти связи записаны физически, как протоптанные тропинки между нейронами. Сейчас они слабеют, потому что вознаграждения больше нет."
  - day: 17
    scientific: "Кортизол и кортикотропин-рилизинг фактор активируют дофаминовые нейроны VTA при стрессе, провоцируя тягу к веществу."
    plain: "Стресс запускает гормон кортизол, который будит систему вознаграждения. Мозг ищет быстрое решение — то, что раньше помогало. Поэтому в напряжённые дни тяга возвращается волнами, даже если ты уже забыл о веществе."
  - day: 18
    scientific: "Ангедония при отмене связана со снижением тонической активности дофаминовых нейронов в nucleus accumbens."
    plain: "Центр удовольствия работает на пониженных оборотах. То, что раньше радовало — музыка, еда, общение — кажется пресным. Это не депрессия, а временное снижение фоновой активности нейронов. Они восстанавливают чувствительность."
  - day: 19
    scientific: "Долговременная потенциация и депрессия синапсов в префронтальной коре перестраивают нейронные сети, отвечающие за принятие решений."
    plain: "Связи между нейронами усиливаются или слабеют в зависимости от того, как часто ты их используешь. Каждый раз, когда ты выбираешь не курить, ты физически укрепляешь новую нейронную цепь. Старая — слабеет."
  - day: 20
    scientific: "Эндогенные опиоиды — бета-эндорфин и энкефалины — модулируют настроение через mu- и delta-рецепторы в прилежащем ядре."
    plain: "Твой мозг производит собственные обезболивающие и молекулы радости. Они выделяются при физической нагрузке, смехе, прикосновениях. THC подавлял их выработку. Сейчас система перезапускается, но ей нужно время."
  - day: 21
    scientific: "Серотонин в орбитофронтальной коре регулирует импульсивность через 5-HT2A и 5-HT1A рецепторы."
    plain: "Серотонин помогает взвешивать последствия до действия. При отмене его баланс нарушен — отсюда импульсивные решения, раздражительность, нетерпеливость. Рецепторы восстанавливают чувствительность, и контроль возвращается."
  - day: 22
    scientific: "Инсула интегрирует интероцептивные сигналы тела и формирует субъективное ощущение тяги как телесную потребность."
    plain: "Островковая доля мозга переводит сигналы тела в ощущения. Тяга ощущается как голод, напряжение в груди, беспокойство в животе. Это не реальная потребность — это мозг интерпретирует старые сигналы. Со временем он переучивается."
  - day: 23
    scientific: "Амигдала усиливает реакцию на негативные стимулы при дефиците эндоканнабиноидов, повышая тревожность."
    plain: "Миндалевидное тело отвечает за страх и тревогу. Без THC оно работает на повышенных оборотах — мир кажется более угрожающим, мелочи раздражают сильнее. Это временная гиперчувствительность, пока собственная система не восстановится."
  - day: 24
    scientific: "Циркадные ритмы регулируются супрахиазматическим ядром через мелатонин и кортизол, нарушенные хроническим употреблением THC."
    plain: "Внутренние часы сбиты. THC влиял на выработку мелатонина — гормона сна. Сейчас мозг заново учится засыпать и просыпаться в правильное время. Первые недели сон может быть рваным, но ритм восстанавливается."
  - day: 25
    scientific: "Митохондрии нейронов восстанавливают эффективность окислительного фосфорилирования после хронического окислительного стресса."
    plain: "Энергетические станции клеток мозга работали в режиме перегрузки. Теперь они ремонтируются — восстанавливают способность производить энергию эффективно. Поэтому ясность мышления возвращается постепенно, а не сразу."
  - day: 26
    scientific: "Нейровоспаление при отмене опосредовано микроглией и провоспалительными цитокинами — IL-1β, TNF-α."
    plain: "Иммунные клетки мозга активированы и выделяют сигнальные молекулы воспаления. Это защитная реакция на изменения. Проявляется как туман в голове, усталость, раздражительность. Воспаление спадает по мере стабилизации."
  - day: 27
    scientific: "Ось HPA восстанавливает отрицательную обратную связь через глюкокортикоидные рецепторы в гиппокампе."
    plain: "Система стресса училась отключаться сама, когда опасность прошла. THC нарушил этот механизм. Сейчас мозг заново настраивает тормоза — учится останавливать выброс гормонов стресса, когда они больше не нужны."
  - day: 28
    scientific: "Окситоцин усиливает социальную мотивацию через рецепторы в прилежащем ядре и снижает активность амигдалы."
    plain: "Гормон привязанности делает общение приятным и снижает тревогу. THC подавлял его эффекты. Теперь контакт с людьми, объятия, разговоры начинают приносить настоящее удовлетворение — не через вещество, а напрямую."
  - day: 29
    scientific: "Эндоканнабиноидная система регулирует аппетит через CB1-рецепторы в гипоталамусе и лептиновый сигналинг."
    plain: "Система, управляющая голодом, была перегружена внешним THC. Сейчас она перекалибруется. Аппетит может скакать — то отсутствует, то волчий. Это временно, пока мозг не научится снова чувствовать сытость и голод естественно."
  - day: 30
    scientific: "Дофаминовые рецепторы D2 в стриатуме восстанавливают плотность и чувствительность после даунрегуляции."
    plain: "Рецепторы удовольствия были заглушены, потому что THC постоянно стимулировал выброс дофамина. Мозг защищался, снижая их количество. Теперь они возвращаются — и с ними возвращается способность радоваться обычным вещам."
  - day: 31
    scientific: "Глутаматергическая передача в префронтальной коре усиливается через NMDA-рецепторы, улучшая рабочую память."
    plain: "Главный возбуждающий сигнал мозга восстанавливает силу. Это основа концентрации, памяти, планирования. Раньше THC тормозил эти процессы. Сейчас связи укрепляются, и ты замечаешь: легче удерживать мысль, доводить дело до конца."
  - day: 32
    scientific: "Нейротрофический фактор мозга BDNF стимулирует рост новых синапсов в гиппокампе и префронтальной коре."
    plain: "Белок роста нервной ткани запускает строительство новых связей между нейронами. Это физическая основа обучения и адаптации. Его уровень растёт при отмене — мозг буквально перестраивается, создавая новые пути вместо старых."
  - day: 33
    scientific: "ГАМК-ергические интернейроны в гиппокампе восстанавливают тормозной контроль над возбуждающими нейронами."
    plain: "Тормозные нейроны учатся снова выключать лишний шум в мозге. Раньше THC делал это грубо, глушил всё подряд. Теперь система учится работать точечно — отключать тревогу, навязчивые мысли, перевозбуждение по необходимости."
  - day: 34
    scientific: "Ацетилхолин в базальных ганглиях модулирует привычное поведение через мускариновые и никотиновые рецепторы."
    plain: "Медиатор внимания и привычек помогает автоматизировать действия. THC нарушал его баланс — отсюда забывчивость, рассеянность. Сейчас система восстанавливается, и ты замечаешь: легче входить в рутину, помнить мелочи, действовать на автомате."
  - day: 35
    scientific: "Норадреналин в голубом пятне регулирует бодрствование и внимание через α- и β-адренорецепторы."
    plain: "Система бодрости и фокуса перезапускается. Раньше THC то глушил её, то перевозбуждал. Теперь она учится работать ровно — давать энергию утром, отключаться вечером, концентрировать внимание без напряжения."
  - day: 36
    scientific: "Пресинаптические CB1-рецепторы восстанавливают функцию ретроградного торможения высвобождения нейромедиаторов."
    plain: "Рецепторы, которые были заняты THC, возвращаются к своей работе — тонко регулировать выброс всех сигналов мозга. Это как восстановление тонкой настройки оркестра. Эмоции, мысли, реакции становятся более управляемыми и предсказуемыми."
