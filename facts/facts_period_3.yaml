period: 3
days: "8-14"
title: "Стабилизация"
facts:
  - day: 8
    scientific: "BDNF (brain-derived neurotrophic factor) активирует TrkB-рецепторы в гиппокампе, запуская каскад MAPK/ERK и стимулируя нейрогенез в зубчатой извилине."
    plain: "В гиппокампе — части мозга отвечающей за память — начинают расти новые нейроны. Это происходит благодаря белку BDNF который работает как удобрение для нервных клеток. THC подавлял этот процесс. Теперь мозг восстанавливает способность формировать новые воспоминания и учиться."
  - day: 9
    scientific: "CB1-рецепторы проходят апрегуляцию: увеличивается их плотность на пресинаптических терминалях базальных ганглиев и префронтальной коры."
    plain: "Рецепторы которые реагировали на THC возвращаются на свои места в мозге. Их количество растёт в зонах отвечающих за движение и принятие решений. Мозг перестраивает чувствительность к собственным сигнальным молекулам после того как внешнее вещество перестало их заменять."
  - day: 10
    scientific: "Норадреналиновая система locus coeruleus восстанавливает базальный тонус: нормализуется выброс норадреналина в кору и гиппокамп."
    plain: "Голубое пятно — крошечная область в стволе мозга — снова начинает правильно дозировать норадреналин. Это вещество управляет бодростью вниманием и реакцией на стресс. THC нарушал его баланс. Сейчас возвращается способность концентрироваться без перевозбуждения."
  - day: 11
    scientific: "Дорсолатеральная префронтальная кора восстанавливает связи с гиппокампом через cingulum bundle, улучшая консолидацию рабочей памяти."
    plain: "Лобная кора налаживает связь с центром памяти. Это позволяет удерживать информацию в голове пока ты её используешь — номер телефона список покупок шаги решения задачи. THC разрывал эти связи. Теперь ты можешь заметить что легче держать мысль и не терять нить разговора."
  - day: 12
    scientific: "Глутаматные AMPA-рецепторы увеличивают проводимость в синапсах CA3-CA1 гиппокампа, усиливая долговременную потенциацию (LTP)."
    plain: "Синапсы — контакты между нейронами — становятся эффективнее. Когда один нейрон активирует другой связь между ними укрепляется. Это основа обучения и памяти. THC ослаблял этот процесс делая сложнее запоминать новое. Сейчас мозг восстанавливает способность формировать прочные воспоминания."
  - day: 13
    scientific: "GABA-ергические интернейроны восстанавливают ингибиторный контроль над пирамидными нейронами неокортекса, стабилизируя баланс возбуждения-торможения."
    plain: "Тормозные нейроны снова контролируют активность основных клеток коры. Они работают как регулятор громкости не давая мозгу перевозбуждаться. THC нарушал этот баланс создавая либо заторможенность либо тревожность. Теперь нервная система находит равновесие между активностью и покоем."
  - day: 14
    scientific: "Префронтальная кора восстанавливает глутаматергические проекции к nucleus accumbens, модулируя дофаминовый ответ на естественные награды."
    plain: "Лобная кора снова управляет центром удовольствия. Она помогает оценивать стоит ли что-то усилий и контролирует импульсы. THC обходил эту систему напрямую активируя награду. Сейчас возвращается способность получать удовольствие от обычных вещей — еды общения достижений — без внешнего стимула."
  - day: 15
    scientific: "Астроциты гиппокампа увеличивают захват глутамата через EAAT2-транспортеры, предотвращая эксайтотоксичность и поддерживая синаптический гомеостаз."
    plain: "Вспомогательные клетки мозга очищают пространство между нейронами от избытка сигнальных молекул. Это защищает нейроны от перегрузки и поддерживает стабильную работу. THC нарушал этот процесс. Теперь мозг лучше справляется с нагрузкой и восстанавливается после стресса."
  - day: 16
    scientific: "Серотониновые 5-HT1A-рецепторы в дорсальном ядре шва восстанавливают ауторегуляцию, нормализуя серотонинергический тонус в лимбической системе."
    plain: "Система серотонина настраивает сама себя. Рецепторы в стволе мозга определяют сколько серотонина нужно выбросить в эмоциональные центры. THC сбивал эту настройку. Сейчас возвращается стабильность настроения — меньше резких перепадов от апатии к раздражению."
  - day: 17
    scientific: "Митохондрии нейронов префронтальной коры увеличивают продукцию АТФ через окислительное фосфорилирование, восстанавливая энергетический метаболизм."
    plain: "Энергетические станции нейронов работают эффективнее. Они производят топливо для работы мозга — особенно в зонах отвечающих за планирование и самоконтроль. THC снижал их производительность. Теперь ты можешь заметить что думать стало легче а умственная усталость наступает позже."
  - day: 18
    scientific: "Олигодендроциты усиливают миелинизацию аксонов в белом веществе префронтальной коры, ускоряя проведение потенциалов действия между ассоциативными зонами."
    plain: "Изоляция на нервных волокнах становится плотнее. Это ускоряет передачу сигналов между разными областями мозга. THC замедлял этот процесс особенно в зонах отвечающих за сложное мышление. Сейчас мысли текут быстрее а связи между идеями становятся очевиднее."
