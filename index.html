<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Отмена каннабиса — нейрохимия восстановления</title>
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0c0f;
                --surface: #111318;
                --border: #1e2330;
                --text: #c8d0e0;
                --text-dim: #5a6480;
                --text-bright: #e8edf8;
                --accent: #4a9eff;
                --red: #e74c3c;
                --orange: #e67e22;
                --yellow: #f1c40f;
                --green: #2ecc71;
                --blue: #3498db;
                --teal: #1abc9c;
                --mono: "IBM Plex Mono", monospace;
                --sans: "IBM Plex Sans", sans-serif;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                font-size: 14px;
                line-height: 1.6;
                min-height: 100vh;
            }

            /* HEADER */
            .header {
                border-bottom: 1px solid var(--border);
                padding: 40px 60px 32px;
                position: relative;
                overflow: hidden;
            }
            .header::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    var(--accent),
                    transparent
                );
            }
            .header-label {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.2em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-bottom: 12px;
            }
            .header h1 {
                font-size: 28px;
                font-weight: 300;
                color: var(--text-bright);
                letter-spacing: -0.02em;
                margin-bottom: 8px;
            }
            .header h1 span {
                color: var(--accent);
                font-weight: 500;
            }
            .header-sub {
                font-size: 13px;
                color: var(--text-dim);
                font-family: var(--mono);
            }

            /* TIMELINE BAR */
            .timeline-container {
                padding: 32px 60px;
                border-bottom: 1px solid var(--border);
            }
            .timeline-label {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.15em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-bottom: 16px;
            }
            .timeline-track {
                position: relative;
                height: 64px;
                display: flex;
                gap: 3px;
            }
            .tl-segment {
                flex: 1;
                border-radius: 3px;
                cursor: pointer;
                position: relative;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 0 6px 6px;
                overflow: hidden;
            }
            .tl-segment:hover {
                opacity: 0.85;
                transform: translateY(-2px);
            }
            .tl-segment.active {
                outline: 2px solid rgba(255, 255, 255, 0.3);
                outline-offset: 2px;
            }
            .tl-bar {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 3px;
                transition: height 0.4s ease;
            }
            .tl-days {
                font-family: var(--mono);
                font-size: 9px;
                color: rgba(255, 255, 255, 0.5);
                position: relative;
                z-index: 1;
            }

            /* INTENSITY CHART */
            .chart-container {
                padding: 32px 60px;
                border-bottom: 1px solid var(--border);
            }
            .chart-title {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.15em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                gap: 24px;
            }
            .chart-legend {
                display: flex;
                gap: 20px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 10px;
                color: var(--text-dim);
            }
            .legend-line {
                width: 20px;
                height: 2px;
                border-radius: 1px;
            }
            .chart-note {
                font-size: 10px;
                color: var(--text-dim);
                font-family: var(--mono);
                margin-top: 8px;
                opacity: 0.6;
            }
            .chart-wrap {
                position: relative;
                height: 140px;
                max-width: 960px;
            }
            svg.intensity-chart {
                width: 100%;
                height: 100%;
                display: block;
            }

            /* MAIN LAYOUT */
            .main {
                display: grid;
                grid-template-columns: 220px 1fr;
                min-height: calc(100vh - 320px);
            }

            /* NAV */
            .nav {
                border-right: 1px solid var(--border);
                padding: 24px 0;
            }
            .nav-item {
                padding: 12px 24px;
                cursor: pointer;
                border-left: 2px solid transparent;
                transition: all 0.15s;
                position: relative;
            }
            .nav-item:hover {
                background: rgba(255, 255, 255, 0.02);
            }
            .nav-item.active {
                border-left-color: var(--accent);
                background: rgba(74, 158, 255, 0.05);
            }
            .nav-days {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--text-dim);
                letter-spacing: 0.1em;
                margin-bottom: 3px;
            }
            .nav-title {
                font-size: 12px;
                font-weight: 500;
                color: var(--text);
            }
            .nav-item.active .nav-title {
                color: var(--text-bright);
            }
            .nav-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* CONTENT */
            .content {
                padding: 40px 48px;
                overflow-y: auto;
            }

            .period-header {
                margin-bottom: 40px;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--border);
            }
            .period-tag {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.2em;
                color: var(--text-dim);
                text-transform: uppercase;
                margin-bottom: 8px;
            }
            .period-title {
                font-size: 24px;
                font-weight: 300;
                color: var(--text-bright);
                letter-spacing: -0.02em;
                margin-bottom: 6px;
            }
            .period-subtitle {
                font-size: 13px;
                color: var(--text-dim);
                font-family: var(--mono);
            }

            /* INTENSITY BADGE */
            .intensity-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-top: 12px;
                padding: 4px 12px;
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid var(--border);
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text-dim);
            }
            .intensity-bar {
                display: flex;
                gap: 2px;
            }
            .intensity-pip {
                width: 8px;
                height: 8px;
                border-radius: 1px;
                background: var(--border);
            }
            .intensity-pip.on {
                background: currentColor;
            }

            /* BLOCKS */
            .blocks {
                display: grid;
                gap: 20px;
            }

            .block {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                overflow: hidden;
            }
            .block-header {
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .block-icon {
                width: 20px;
                height: 20px;
                opacity: 0.7;
            }
            .block-heading {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .block-body {
                padding: 20px;
            }
            .block-body p {
                font-size: 13px;
                line-height: 1.7;
                color: var(--text);
            }

            /* SYMPTOMS TABLE */
            .symptoms-list {
                display: grid;
                gap: 12px;
            }
            .symptom-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                padding: 12px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 4px;
                border-left: 2px solid var(--border);
            }
            .symptom-name {
                font-size: 12px;
                font-weight: 500;
                color: var(--text-bright);
            }
            .symptom-cause {
                font-size: 12px;
                color: var(--text-dim);
                font-style: italic;
            }

            /* TIP BLOCK */
            .tip-block {
                border-color: rgba(74, 158, 255, 0.2);
                background: rgba(74, 158, 255, 0.04);
            }
            .tip-block .block-header {
                border-color: rgba(74, 158, 255, 0.15);
            }
            .tip-block .block-heading {
                color: var(--accent);
                opacity: 0.7;
            }
            .tip-block .block-body p {
                color: var(--text-bright);
            }

            /* RECOVERY BLOCK */
            .recovery-block {
                border-color: rgba(46, 204, 113, 0.2);
            }
            .recovery-block .block-heading {
                color: var(--green);
                opacity: 0.7;
            }

            /* SYSTEMS DIAGRAM */
            .systems-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-top: 20px;
            }
            .system-card {
                padding: 14px;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: rgba(0, 0, 0, 0.2);
            }
            .system-name {
                font-family: var(--mono);
                font-size: 10px;
                color: var(--text-dim);
                margin-bottom: 8px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .system-bar-wrap {
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                overflow: hidden;
            }
            .system-bar-fill {
                height: 100%;
                border-radius: 2px;
                transition: width 0.6s ease;
            }
            .system-pct {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text-bright);
                margin-top: 6px;
            }

            /* PERIOD COLORS */
            .c1 {
                color: #e74c3c;
            }
            .c2 {
                color: #c0392b;
            }
            .c3 {
                color: #e67e22;
            }
            .c4 {
                color: #f39c12;
            }
            .c5 {
                color: #27ae60;
            }
            .c6 {
                color: #2980b9;
            }
            .c7 {
                color: #1abc9c;
            }

            .fade-in {
                animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 768px) {
                .header,
                .timeline-container,
                .chart-container {
                    padding: 24px;
                }
                .main {
                    grid-template-columns: 1fr;
                }
                .nav {
                    display: flex;
                    overflow-x: auto;
                    border-right: none;
                    border-bottom: 1px solid var(--border);
                    padding: 0;
                }
                .nav-item {
                    min-width: 120px;
                    border-left: none;
                    border-bottom: 2px solid transparent;
                }
                .nav-item.active {
                    border-bottom-color: var(--accent);
                    border-left-color: transparent;
                }
                .content {
                    padding: 24px;
                }
                .symptom-row {
                    grid-template-columns: 1fr;
                }
                .systems-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="header-label">Нейрохимия восстановления</div>
            <h1>Отмена <span>каннабиса</span></h1>
            <div class="header-sub">
                CB1-рецепторы · эндоканнабиноидная система · нейропластика
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline-label">Временная шкала — нажми на период</div>
            <div class="timeline-track" id="tlTrack"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">
                Дискомфорт по периодам
                <div class="chart-legend">
                    <div class="legend-item">
                        <div
                            class="legend-line"
                            style="background: #e74c3c"
                        ></div>
                        физический
                    </div>
                    <div class="legend-item">
                        <div
                            class="legend-line"
                            style="background: #9b59b6"
                        ></div>
                        психологический
                    </div>
                </div>
            </div>
            <div class="chart-wrap">
                <svg
                    class="intensity-chart"
                    id="intensityChart"
                    viewBox="0 0 800 140"
                    preserveAspectRatio="xMidYMid meet"
                ></svg>
            </div>
            <div class="chart-note">
                * качественная схема, не количественные данные
            </div>
        </div>

        <div class="main">
            <nav class="nav" id="nav"></nav>
            <div class="content" id="content"></div>
        </div>

        <script>

            function buildTimeline() {
                const track = document.getElementById("tlTrack");
                const widths = [3, 4, 7, 16, 30, 30, 10];
                PERIODS.forEach((p, i) => {
                    const seg = document.createElement("div");
                    seg.className = "tl-segment" + (i === 0 ? " active" : "");
                    seg.style.flex = widths[i];
                    seg.style.minHeight = "100%";
                    const bar = document.createElement("div");
                    bar.className = "tl-bar";
                    bar.style.background = p.color;
                    bar.style.height = p.intensity * 10 + "%";
                    bar.style.opacity = "0.7";
                    seg.appendChild(bar);
                    const label = document.createElement("div");
                    label.className = "tl-days";
                    label.textContent = p.days;
                    seg.appendChild(label);
                    seg.addEventListener("click", () => selectPeriod(i));
                    track.appendChild(seg);
                });
            }

            function buildChart() {
                const svg = document.getElementById("intensityChart");
                const W = 800,
                    H = 140;
                const xPcts = [0.02, 0.08, 0.18, 0.38, 0.62, 0.82, 0.96];

                // физический дискомфорт — пик в 1-7, быстро падает
                const physVals = [8, 10, 6, 4, 2, 1, 0.5];
                // психологический — нарастает к 15-30, пик выше физического, долго держится
                const psychVals = [3, 5, 7, 10, 5, 2, 1];

                function makePoints(vals) {
                    return vals.map((v, i) => ({
                        x: xPcts[i] * W,
                        y: H - (v / 10) * (H - 12) - 6,
                    }));
                }

                function curvePath(pts) {
                    let d = `M ${pts[0].x} ${pts[0].y}`;
                    for (let i = 1; i < pts.length; i++) {
                        const cx = (pts[i - 1].x + pts[i].x) / 2;
                        d += ` C ${cx} ${pts[i - 1].y}, ${cx} ${pts[i].y}, ${pts[i].x} ${pts[i].y}`;
                    }
                    return d;
                }

                function fillPath(pts) {
                    let d = `M ${pts[0].x} ${H} L ${pts[0].x} ${pts[0].y}`;
                    for (let i = 1; i < pts.length; i++) {
                        const cx = (pts[i - 1].x + pts[i].x) / 2;
                        d += ` C ${cx} ${pts[i - 1].y}, ${cx} ${pts[i].y}, ${pts[i].x} ${pts[i].y}`;
                    }
                    d += ` L ${pts[pts.length - 1].x} ${H} Z`;
                    return d;
                }

                const physPts = makePoints(physVals);
                const psychPts = makePoints(psychVals);

                svg.innerHTML = `
    <defs>
      <linearGradient id=physGrad x1=0 y1=0 x2=0 y2=1>
        <stop offset=0% stop-color=#e74c3c stop-opacity=0.25/>
        <stop offset=100% stop-color=#e74c3c stop-opacity=0/>
      </linearGradient>
      <linearGradient id=psychGrad x1=0 y1=0 x2=0 y2=1>
        <stop offset=0% stop-color=#9b59b6 stop-opacity=0.2/>
        <stop offset=100% stop-color=#9b59b6 stop-opacity=0/>
      </linearGradient>
    </defs>
    <path d="${fillPath(physPts)}" fill="url(#physGrad)"/>
    <path d="${fillPath(psychPts)}" fill="url(#psychGrad)"/>
    <path d="${curvePath(physPts)}" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.8"/>
    <path d="${curvePath(psychPts)}" fill="none" stroke="#9b59b6" stroke-width="1.5" opacity="0.8" stroke-dasharray="5,3"/>
  `;

                // dots on physical curve — clickable
                physPts.forEach((pt, i) => {
                    const circle = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "circle",
                    );
                    circle.setAttribute("cx", pt.x);
                    circle.setAttribute("cy", pt.y);
                    circle.setAttribute("r", "3.5");
                    circle.setAttribute("fill", "#e74c3c");
                    circle.setAttribute("stroke", "#0a0c0f");
                    circle.setAttribute("stroke-width", "2");
                    circle.style.cursor = "pointer";
                    circle.addEventListener("click", () => selectPeriod(i));
                    svg.appendChild(circle);
                });

                psychPts.forEach((pt, i) => {
                    const circle = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "circle",
                    );
                    circle.setAttribute("cx", pt.x);
                    circle.setAttribute("cy", pt.y);
                    circle.setAttribute("r", "3");
                    circle.setAttribute("fill", "#9b59b6");
                    circle.setAttribute("stroke", "#0a0c0f");
                    circle.setAttribute("stroke-width", "2");
                    circle.style.cursor = "pointer";
                    circle.addEventListener("click", () => selectPeriod(i));
                    svg.appendChild(circle);
                });
            }
            function buildNav() {

                    nav.appendChild(item);

            function intensityPips(val, color) {

                html += "</div>";
                return html;

      </div>

      <div class="blocks">

            <div class="block-heading">Симптомы и их причины</div>
          </div>
          <div class="block-body">
            <div class="symptoms-list">${symptomsHTML}</div>
          </div>
        </div>

        <div class="block recovery-block">
          <div class="block-header">
            <svg class="block-icon" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <div class="block-heading">Что восстанавливается прямо сейчас</div>
          </div>
          <div class="block-body"><p>${p.recovering}</p></div>
        </div>

        <div class="block">
          <div class="block-header">
            <svg class="block-icon" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/>
            </svg>
            <div class="block-heading">Состояние нейросистем — % от нормы</div>
          </div>
          <div class="block-body">
            <div class="systems-grid">${systemsHTML}</div>
          </div>
        </div>

        <div class="block tip-block">
          <div class="block-header">
            <svg class="block-icon" viewBox="0 0 24 24" fill="none" stroke="#4a9eff" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div class="block-heading">Совет на этот период</div>
          </div>
          <div class="block-body"><p>${p.tip}</p></div>
        </div>
      </div>
    </div>
  `;
            }

            function selectPeriod(idx) {
                currentPeriod = idx;

                document.querySelectorAll(".nav-item").forEach((el, i) => {
                    el.classList.toggle("active", i === idx);
                });
                document.querySelectorAll(".tl-segment").forEach((el, i) => {
                    el.classList.toggle("active", i === idx);
                });

                renderContent(idx);
                document.getElementById("content").scrollTop = 0;
            }

            buildTimeline();
            buildChart();
            buildNav();
            renderContent(0);
        </script>
    </body>
